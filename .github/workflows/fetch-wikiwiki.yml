name: Fetch Arcaea WikiWiki data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/fetch_wikis.py"
      - "tools/fetch_wikiwiki_pages.py"
      - "tools/wikiwiki_console_extract.js"
      - "tools/merge_wiki_entry.py"
      - "requirements-fetch.txt"
      - ".github/workflows/fetch-wikiwiki.yml"
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  fetch-wikiwiki:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fetch.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-fetch.txt

      - name: Validate manual helper scripts
        run: |
          node --check tools/wikiwiki_console_extract.js
          python -m py_compile tools/merge_wiki_entry.py
          python tools/merge_wiki_entry.py --self-test

      - name: Fetch Japanese WikiWiki song index
        run: |
          mkdir -p build
          python tools/fetch_wikis.py wikiwiki-index \
            --strict \
            --output build/wikiwiki-jp-songs.json

      - name: Fetch representative song pages
        run: |
          python tools/fetch_wikiwiki_pages.py \
            --strict \
            --index build/wikiwiki-jp-songs.json \
            --title "Purgatorium" \
            --title "#1f1e33" \
            --title "Testify" \
            --title "DEINOS PHAINEIN" \
            --delay 0.15 \
            --output build/wikiwiki-jp-page-samples.json

      - name: Validate known page values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("build/wikiwiki-jp-songs.json").read_text(encoding="utf-8"))
          pages = json.loads(Path("build/wikiwiki-jp-page-samples.json").read_text(encoding="utf-8"))

          iv = index["validation"]
          pv = pages["validation"]
          print("index rows:", iv["parsed_total_rows"])
          print("index by kind:", iv["parsed_by_kind"])
          print("page fetch:", pv)

          if not iv["ok"]:
              raise SystemExit("index validation failed")
          if not pv["ok"]:
              raise SystemExit("page parser validation failed")

          by_title = {r["song"]["title"]: r for r in pages["songs"]}

          def chart(title, diff):
              return by_title[title]["charts"][diff]

          assert chart("Purgatorium", "PST")["notes"] == 609
          assert chart("Purgatorium", "PST")["constant"] == 2.5
          assert chart("Purgatorium", "PRS")["notes"] == 641
          assert chart("Purgatorium", "PRS")["constant"] == 6.0
          assert chart("Purgatorium", "FTR")["notes"] == 983
          assert chart("Purgatorium", "FTR")["constant"] == 8.4
          assert chart("Purgatorium", "BYD")["notes"] == 1051
          assert chart("Purgatorium", "BYD")["constant"] == 9.6

          testify = by_title["Testify"]
          assert chart("Testify", "PST")["notes"] == 1001
          assert chart("Testify", "PRS")["notes"] == 1225
          assert chart("Testify", "FTR")["notes"] == 1766
          assert chart("Testify", "BYD")["notes"] == 2221
          assert chart("Testify", "PST")["constant"] == 7.8
          assert chart("Testify", "PRS")["constant"] == 9.4
          assert chart("Testify", "FTR")["constant"] == 10.9
          assert chart("Testify", "BYD")["constant"] == 12.0

          deinos = by_title["DEINOS PHAINEIN"]
          assert deinos["song"]["bpm"] == 190
          assert deinos["song"]["length"] == "2:48"
          assert deinos["song"]["added_version"] == "7.0.0"
          assert chart("DEINOS PHAINEIN", "PST")["notes"] == 1008
          assert chart("DEINOS PHAINEIN", "PRS")["notes"] == 1178
          assert chart("DEINOS PHAINEIN", "FTR")["level"] == "10+"
          assert chart("DEINOS PHAINEIN", "FTR")["notes"] == 1888
          assert chart("DEINOS PHAINEIN", "FTR")["constant"] == 10.9
          assert chart("DEINOS PHAINEIN", "INS")["level"] == "12"
          assert chart("DEINOS PHAINEIN", "INS")["notes"] == 2228
          assert chart("DEINOS PHAINEIN", "INS")["constant"] == 12.0
          assert set(deinos["_meta"]["missing_constants"]) == {"PST", "PRS"}

          assert "#1f1e33" in by_title
          assert by_title["#1f1e33"]["charts"]

          print("Purgatorium:", by_title["Purgatorium"]["charts"])
          print("Testify:", testify["charts"])
          print("DEINOS:", deinos["charts"])
          print("DEINOS missing constants:", deinos["_meta"]["missing_constants"])
          print("all page assertions passed")
          PY

      - name: Fetch all Japanese WikiWiki song pages
        run: |
          python tools/fetch_wikiwiki_pages.py \
            --index build/wikiwiki-jp-songs.json \
            --all \
            --delay 0.15 \
            --timeout 25 \
            --retries 3 \
            --output build/wikiwiki-jp-pages.json

      - name: Summarize full crawl coverage
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          path = Path("build/wikiwiki-jp-pages.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          validation = data.get("validation", {})
          songs = data.get("songs", [])

          charts = []
          errors = []
          warnings = []
          warning_counts = Counter()
          error_counts = Counter()
          suspicious = []

          for record in songs:
              title = record.get("song", {}).get("title")
              meta = record.get("_meta", {})
              v = meta.get("validation", {})
              rec_errors = list(v.get("errors", []))
              rec_warnings = list(v.get("warnings", []))
              if rec_errors or rec_warnings:
                  suspicious.append({
                      "title": title,
                      "url": meta.get("source_url"),
                      "errors": rec_errors,
                      "warnings": rec_warnings,
                  })
              for item in rec_errors:
                  errors.append({"title": title, "message": item})
                  error_counts[item] += 1
              for item in rec_warnings:
                  warnings.append({"title": title, "message": item})
                  warning_counts[item] += 1

              for difficulty, chart in record.get("charts", {}).items():
                  if chart.get("level") is None and chart.get("constant") is None and chart.get("notes") is None:
                      continue
                  charts.append((title, difficulty, chart))

          charts_with_cc = sum(c.get("constant") is not None for _, _, c in charts)
          charts_with_notes = sum(c.get("notes") is not None for _, _, c in charts)

          summary = {
              "songs_pages_attempted": validation.get("requested", 0),
              "pages_fetched_successfully": validation.get("parsed", 0),
              "pages_failed": validation.get("failed", 0),
              "invalid_pages": len(validation.get("invalid", [])),
              "charts_parsed": len(charts),
              "charts_with_cc": charts_with_cc,
              "charts_missing_cc": len(charts) - charts_with_cc,
              "charts_with_note_counts": charts_with_notes,
              "charts_missing_note_counts": len(charts) - charts_with_notes,
              "validation_errors": len(errors),
              "validation_warnings": len(warnings),
              "fetch_failures": validation.get("failures", []),
              "invalid_titles": validation.get("invalid", []),
              "error_counts": dict(error_counts),
              "warning_counts": dict(warning_counts),
              "suspicious_pages": suspicious,
          }

          Path("build/wikiwiki-jp-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(summary, ensure_ascii=False, indent=2))

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write("# WikiWiki JP full crawl\n\n")
                  f.write("| Metric | Count |\n|---|---:|\n")
                  for label, key in [
                      ("Songs/pages attempted", "songs_pages_attempted"),
                      ("Pages fetched successfully", "pages_fetched_successfully"),
                      ("Pages failed", "pages_failed"),
                      ("Invalid pages", "invalid_pages"),
                      ("Charts parsed", "charts_parsed"),
                      ("Charts with CC", "charts_with_cc"),
                      ("Charts missing CC", "charts_missing_cc"),
                      ("Charts with note counts", "charts_with_note_counts"),
                      ("Charts missing note counts", "charts_missing_note_counts"),
                      ("Validation errors", "validation_errors"),
                      ("Validation warnings", "validation_warnings"),
                  ]:
                      f.write(f"| {label} | {summary[key]} |\n")
                  if summary["fetch_failures"]:
                      f.write("\n## Fetch failures\n")
                      for failure in summary["fetch_failures"]:
                          f.write(f"- `{failure.get('title')}`: {failure.get('error')}\n")
                  if suspicious:
                      f.write("\n## Suspicious parser results\n")
                      for row in suspicious[:100]:
                          details = "; ".join(row["errors"] + row["warnings"])
                          f.write(f"- `{row['title']}`: {details}\n")
          PY

      - name: Upload WikiWiki full crawl
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikiwiki-jp-fetch
          path: |
            build/wikiwiki-jp-songs.json
            build/wikiwiki-jp-page-samples.json
            build/wikiwiki-jp-pages.json
            build/wikiwiki-jp-summary.json
          if-no-files-found: warn
          retention-days: 14
